<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tata Group - Submission Success</title>
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8e/Tata_logo.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="card home" aria-label="Success">
        <div class="success-container" id="successContainer">
          <div class="success-animation">
            <div class="checkmark">✓</div>
          </div>
          <h3>Successfully Submitted!</h3>
          <p>The post will be delivered to the below-mentioned address within a short period of time.</p>
          <div class="submission-details" id="submissionDetails"></div>
          <button class="button primary" id="closeSuccessBtn" style="margin-top: 1.5rem;">Close</button>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
