<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tata Group - Document Viewer</title>
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8e/Tata_logo.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="fullscreen-viewer" aria-label="Document Viewer">
      <header class="fullscreen-viewer-header">
        <h1 class="fullscreen-viewer-title">tata titan shares .pdf</h1>
        <button class="button secondary" id="backToHomeFromDocBtn" type="button">Back</button>
      </header>
      <iframe class="fullscreen-pdf-frame" id="pdfFrame" title="Document viewer"></iframe>
    </div>

    <script src="app.js"></script>
  </body>
</html>
